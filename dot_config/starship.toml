# Starship Prompt Configuration (Pure Minimal, Nord Palette, SSH-Safe Single-Line)
"$schema" = 'https://starship.rs/config-schema.json'

palette = "nord"
add_newline = false
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$username\
$hostname"""

[palettes.nord]
polar_night_1 = "#2E3440"
polar_night_2 = "#3B4252"
polar_night_3 = "#434C5E"
polar_night_4 = "#4C566A"
muted = "#7B88A1"
snow_storm_1 = "#D8DEE9"
snow_storm_2 = "#E5E9F0"
snow_storm_3 = "#ECEFF4"
frost_1 = "#8FBCBB"
frost_2 = "#88C0D0"
frost_3 = "#81A1C1"
frost_4 = "#5E81AC"
aurora_red = "#BF616A"
aurora_orange = "#D08770"
aurora_yellow = "#EBCB8B"
aurora_green = "#A3BE8C"
aurora_purple = "#B48EAD"

[character]
success_symbol = "[›](bold aurora_green)"
error_symbol = "[›](bold aurora_red)"
vimcmd_symbol = "[‹](bold frost_2)"

[directory]
style = "bold frost_2"
truncation_length = 4
truncate_to_repo = false
read_only = " [ro]"
read_only_style = "aurora_red"

[git_branch]
style = "aurora_purple"
symbol = ""
format = "[$branch(:$remote_branch)]($style) "

[git_state]
style = "aurora_yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[git_status]
style = "aurora_yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[status]
disabled = false
symbol = "✘ "
style = "bold aurora_red"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 2000
style = "muted"
format = "[$duration]($style) "

[jobs]
symbol = "*"
style = "aurora_yellow"
format = "[$symbol$number]($style) "

[username]
show_always = true
style_user = "frost_3"
style_root = "bold aurora_red"
format = "[$user]($style)"

[hostname]
ssh_only = false
ssh_symbol = ""
style = "frost_3"
format = "[@$hostname]($style)"
